name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18.x"
        cache: "npm"
    - run: npm ci
    - run: npm run build
    - run: npm run test -- --run
    - run: npm run coverage
